[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wuhan-rtc"
version = "0.6.7"
description = "Sparse-sensing, actuator-agnostic differentiable MPC for large urban drainage networks"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "PyYAML>=6.0",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
swmm = ["pyswmm>=2.0"]

[project.scripts]
rtc-inp-audit-v2 = "rtc.inp_audit_v2:main"
rtc-resolve-priority = "rtc.priority_resolver:main"
rtc-split-groups = "rtc.pipeline_cli:split_groups_main"
rtc-validate-rainfall-design = "rtc.rainfall_design:main"
rtc-prepare-event-suite = "rtc.event_preparation:main"
rtc-build-method-testbed-v067 = "rtc.method_testbed_v067:main"
rtc-check-study-readiness = "rtc.study_readiness:main"
rtc-init-fresh-workspace = "rtc.fresh_workspace:main"
rtc-validate-fresh-index = "rtc.fresh_model_guard:validate_index_main"
rtc-build-graph = "rtc.pipeline_cli:build_graph_main"
rtc-compile-formal-assets = "rtc.formal_assets_v3:main"
rtc-build-baseline-cache = "rtc.baseline_cache_cli_v2:main"
rtc-design-phase0-events = "rtc.phase0_design:main"
rtc-run-d0-batch = "rtc.d0_batch_v2:run_d0_batch_main"
rtc-run-d1-batch = "rtc.large_data_cli:run_d1_batch_main"
rtc-run-d1-exploration = "rtc.d1_exploration:main"
rtc-build-step1-index = "rtc.step1_index:main"
rtc-design-checkpoints = "rtc.checkpoint_design:main"
rtc-design-probes = "rtc.cli:design_probes_main"
rtc-design-probes-efficient = "rtc.efficient_probe_design:main"
rtc-run-probes = "rtc.d2_runner:main"
rtc-control-leverage-audit = "rtc.control_leverage:main"
rtc-phase0-timescale = "rtc.phase0_timescale:main"
rtc-freeze-phase0-timing = "rtc.timing_freeze:main"
rtc-design-d3 = "rtc.d3_design_cli:main"
rtc-run-d3-batch = "rtc.d3_runner_guard:main"
rtc-build-step2-index = "rtc.data_index:main"
rtc-train-step1-large = "rtc.fresh_model_guard:train_step1_main"
rtc-accept-step1-large = "rtc.fresh_model_guard:accept_step1_main"
rtc-compile-step2-shards = "rtc.fresh_model_guard:compile_step2_shards_main"
rtc-train-step2-large = "rtc.fresh_model_guard:train_step2_main"
rtc-accept-step2-large = "rtc.fresh_model_guard:accept_step2_main"
rtc-formal-gradient-v2 = "rtc.gradient_guard:main"
rtc-formal-ranking = "rtc.ranking_guard:main"
rtc-accept-gate = "rtc.acceptance_gate:main"
rtc-run-policy = "rtc.production_guard:main"
rtc-accept-runtime = "rtc.runtime_acceptance:main"
rtc-record-pipeline-stage = "rtc.pipeline_ledger_cli:main"
rtc-build-policy-artifacts = "rtc.policy_artifacts_cli:main"
rtc-policy-lock-v5 = "rtc.policy_lock_v6:main"
rtc-formalize-run = "rtc.formalize_run_v2:main"
rtc-compile-final-v4 = "rtc.formal_final_v5:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
