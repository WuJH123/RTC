[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wuhan-rtc"
version = "0.2.0"
description = "Sparse-sensing, actuator-agnostic differentiable MPC for urban drainage networks"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "PyYAML>=6.0",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
swmm = ["pyswmm>=2.0"]

[project.scripts]
rtc-audit-inp = "rtc.cli:audit_inp_main"
rtc-design-probes = "rtc.cli:design_probes_main"
rtc-run-probes = "rtc.cli:run_probes_main"
rtc-build-graph = "rtc.pipeline_cli:build_graph_main"
rtc-make-passive-inp = "rtc.pipeline_cli:make_passive_inp_main"
rtc-split-groups = "rtc.pipeline_cli:split_groups_main"
rtc-run-trajectory = "rtc.pipeline_cli:run_trajectory_main"
rtc-design-d3 = "rtc.pipeline_cli:design_d3_main"
rtc-run-d3 = "rtc.pipeline_cli:run_d3_main"
rtc-compile-step1 = "rtc.pipeline_cli:compile_step1_main"
rtc-compile-step2 = "rtc.model_cli:compile_step2_dataset_main"
rtc-train-step1 = "rtc.model_cli:train_step1_main"
rtc-accept-step1 = "rtc.model_cli:accept_step1_main"
rtc-train-step2 = "rtc.model_cli:train_step2_main"
rtc-accept-step2 = "rtc.model_cli:accept_step2_main"
rtc-calibrate-safety = "rtc.evidence_cli:calibrate_safety_main"
rtc-audit-safety = "rtc.evidence_cli:audit_safety_main"
rtc-record-stage = "rtc.evidence_cli:record_stage_main"
rtc-policy-lock = "rtc.evidence_cli:policy_lock_main"
rtc-compile-final = "rtc.final_cli:compile_final_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
