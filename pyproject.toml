[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wuhan-rtc"
version = "0.1.0"
description = "Sparse-sensing, actuator-agnostic differentiable MPC for urban drainage networks"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "PyYAML>=6.0",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
swmm = ["pyswmm>=2.0"]

[project.scripts]
rtc-audit-inp = "rtc.cli:audit_inp_main"
rtc-design-probes = "rtc.cli:design_probes_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
