[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wuhan-rtc"
version = "0.4.0"
description = "Sparse-sensing, actuator-agnostic differentiable MPC for large urban drainage networks"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "PyYAML>=6.0",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
swmm = ["pyswmm>=2.0"]

[project.scripts]
rtc-inp-audit-v2 = "rtc.inp_audit_v2:main"
rtc-resolve-priority = "rtc.priority_resolver:main"
rtc-split-groups = "rtc.pipeline_cli:split_groups_main"
rtc-build-graph = "rtc.pipeline_cli:build_graph_main"
rtc-build-baseline-cache = "rtc.baseline_cache:main"
rtc-run-d0-batch = "rtc.large_data_cli:run_d0_batch_main"
rtc-run-d1-exploration = "rtc.d1_exploration:main"
rtc-design-checkpoints = "rtc.checkpoint_design:main"
rtc-design-probes = "rtc.cli:design_probes_main"
rtc-run-probes = "rtc.cli:run_probes_main"
rtc-design-d3 = "rtc.pipeline_cli:design_d3_main"
rtc-run-d3-batch = "rtc.large_data_cli:run_d3_batch_main"
rtc-train-step1-large = "rtc.large_model_cli:train_step1_large_main"
rtc-accept-step1-large = "rtc.large_model_cli:accept_step1_large_main"
rtc-compile-step2-shards = "rtc.large_model_cli:compile_step2_shards_main"
rtc-train-step2-large = "rtc.step2_train_v2:train_step2_large_v2_main"
rtc-accept-step2-large = "rtc.step2_accept_v2:accept_step2_large_v2_main"
rtc-accept-gate = "rtc.acceptance_gate:main"
rtc-run-policy = "rtc.production_cli:run_policy_main"
rtc-policy-lock-v5 = "rtc.formal_lock_v5:main"
rtc-formalize-run = "rtc.formalize_run:main"
rtc-compile-final-v4 = "rtc.formal_final_v4:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
