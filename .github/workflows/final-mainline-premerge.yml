name: final-mainline-premerge

on:
  push:
    branches:
      - agent/final-receding-policy-return-mainline
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,swmm]"
      - name: Compile maintained Python
        run: |
          python -m compileall -q src scripts tests
      - name: Current lint gate
        run: |
          python scripts/lint_current_surface.py
          python -m ruff check \
            scripts/audit_direct_tfv_policy_return_mechanism_panel_current.py \
            src/rtc/direct_tfv_policy_return_selected_boundary_v21.py \
            scripts/train_step3_selected_boundary_v21_current.py \
            tests/test_step3_selected_boundary_v21.py \
            src/rtc/operational_benchmark_v1.py \
            src/rtc/direct_tfv_operational_v21_runtime.py \
            scripts/freeze_project7_operational_benchmark5_current.py \
            scripts/build_project7_operational_baseline_cache_current.py \
            scripts/run_policy_direct_tfv_operational_v21_development.py \
            scripts/run_project7_operational_benchmark5_current.py \
            tests/test_operational_benchmark_v1.py \
            tests/test_direct_tfv_policy_return_hold_aware_metrics.py \
            tests/test_native_supervisory_control.py \
            --select E4,E7,E9,F
      - name: High-signal Practical RTC tests
        run: |
          python -m pytest -q \
            tests/test_direct_tfv_first_move.py \
            tests/test_direct_tfv_first_move_cli.py \
            tests/test_direct_tfv_robust_rainfall.py \
            tests/test_direct_tfv_policy_return.py \
            tests/test_direct_tfv_policy_return_portfolio.py \
            tests/test_direct_tfv_hybrid_gradient_portfolio.py \
            tests/test_direct_tfv_policy_return_hold_aware_metrics.py \
            tests/test_step3_selected_boundary_v21.py \
            tests/test_operational_benchmark_v1.py \
            tests/test_native_supervisory_control.py \
            tests/test_direct_tfv_runtime_adapter.py \
            tests/test_practical_rtc_assets.py \
            tests/test_practical_rtc_v14_contract.py \
            tests/test_current_step2_routing.py
      - name: Full pytest
        run: |
          python -m pytest -q
      - name: Practical RTC CLI help gates
        run: |
          python scripts/build_native_supervisory_control_current.py --help >/dev/null
          python scripts/build_direct_tfv_sequence_support_current.py --help >/dev/null
          python scripts/build_project7_practical_asset_manifest_current.py --help >/dev/null
          python scripts/run_policy_direct_tfv_base_hybrid_parent_current.py --help >/dev/null
          python scripts/capture_direct_tfv_policy_return_context_current.py --help >/dev/null
          python scripts/design_direct_tfv_policy_return_portfolio_current.py --help >/dev/null
          python scripts/run_direct_tfv_policy_return_query_current.py --help >/dev/null
          python scripts/audit_direct_tfv_policy_return_mechanism_panel_current.py --help >/dev/null
          python scripts/compile_direct_tfv_policy_return_dataset_current.py --help >/dev/null
          python scripts/train_direct_tfv_policy_return_current.py --help >/dev/null
          python scripts/score_direct_tfv_policy_return_calibration_current.py --help >/dev/null
          python scripts/calibrate_direct_tfv_policy_return_portfolio_admission_current.py --help >/dev/null
          python scripts/run_policy_direct_tfv_policy_return_development.py --help >/dev/null
          python scripts/train_step3_selected_boundary_v21_current.py --help >/dev/null
          python scripts/freeze_project7_operational_benchmark5_current.py --help >/dev/null
          python scripts/build_project7_operational_baseline_cache_current.py --help >/dev/null
          python scripts/run_policy_direct_tfv_operational_v21_development.py --help >/dev/null
          python scripts/run_project7_operational_benchmark5_current.py --help >/dev/null
          python scripts/run_six_baselines_development_current.py --help >/dev/null
          python scripts/compare_direct_tfv_baselines_current.py --help >/dev/null
          python scripts/add_pfv_to_direct_tfv_comparison_current.py --help >/dev/null
