name: final-mainline-premerge

on:
  push:
    branches:
      - agent/final-receding-policy-return-mainline
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,swmm]"
      - name: Compile maintained Python
        run: |
          python -m compileall -q src scripts tests
      - name: Current lint gate
        run: |
          python scripts/lint_current_surface.py
      - name: High-signal Direct-TFV tests
        run: |
          python -m pytest -q \
            tests/test_direct_tfv_first_move.py \
            tests/test_direct_tfv_first_move_cli.py \
            tests/test_direct_tfv_robust_rainfall.py \
            tests/test_direct_tfv_policy_return.py \
            tests/test_current_step2_routing.py
      - name: Full pytest
        run: |
          python -m pytest -q
      - name: CLI help gates
        run: |
          python scripts/build_direct_tfv_first_move_context_current.py --help >/dev/null
          python scripts/design_direct_tfv_first_move_calibration_current.py --help >/dev/null
          python scripts/calibrate_direct_tfv_first_move_admission_current.py --help >/dev/null
          python scripts/design_direct_tfv_robust_rainfall_first_move_calibration_current.py --help >/dev/null
          python scripts/calibrate_direct_tfv_robust_rainfall_first_move_admission_current.py --help >/dev/null
          python scripts/run_policy_direct_tfv_robust_rainfall_development.py --help >/dev/null
          python scripts/run_direct_tfv_policy_return_pair_current.py --help >/dev/null
          python scripts/compile_direct_tfv_policy_return_dataset_current.py --help >/dev/null
          python scripts/train_direct_tfv_policy_return_current.py --help >/dev/null
          python scripts/score_direct_tfv_policy_return_calibration_current.py --help >/dev/null
          python scripts/calibrate_direct_tfv_policy_return_admission_current.py --help >/dev/null
          python scripts/run_policy_direct_tfv_policy_return_development.py --help >/dev/null
